<a class="skip-link" href="#main-content">
  <span data-lang="ja">メインコンテンツへ移動</span>
  <span data-lang="en">Skip to main content</span>
</a>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand-link" href="{{root}}index.html" aria-label="{{brand}} Home">
      <span class="brand-mark" aria-hidden="true">{{brandMark}}</span>
      <span class="brand-text">
        <span class="brand-name">{{brand}}</span>
        <span class="brand-sub mono">{{brandSub}}</span>
      </span>
    </a>

    <nav class="site-nav" aria-label="Primary navigation">
      <a class="nav-link is-active" href="{{root}}index.html#game-center">
        <span>Game Center</span>
      </a>
      <a class="nav-link" href="{{root}}index.html#about">
        <span>About</span>
      </a>
    </nav>

    <div class="header-actions">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-btn is-active" data-set-lang="ja" aria-pressed="true">JP</button>
        <button type="button" class="lang-btn" data-set-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </div>
</header>
